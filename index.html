<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFinder — Global E-Commerce Directory</title>
  <meta name="description" content="Search verified online stores worldwide for clothing, tech, bikes, and more.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
    
    .ad-banner { position: sticky; top: 0; background: #1e293b; border-bottom: 1px solid #334155; text-align: center; padding: 8px; font-size: 12px; color: #38bdf8; z-index: 100; }
    .ad-banner span { color: #94a3b8; font-size: 10px; display: block; text-transform: uppercase; }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin: 20px 0; }
    h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; }

    .search-box { display: flex; gap: 10px; margin: 25px 0 15px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
    select { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.85rem; outline: none; cursor: pointer; }

    .results-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .results-grid { grid-template-columns: 1fr 1fr; } }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .store-name { font-weight: 600; font-size: 1.1rem; color: #f8fafc; }
    .rating { background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    
    .badge { display: inline-block; background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; margin-top: 4px; }
    
    .product-info { margin: 12px 0; border-top: 1px solid #334155; padding-top: 10px; }
    .item-title { font-size: 0.9rem; color: #cbd5e1; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .shipping { font-size: 0.8rem; color: #94a3b8; }
    .visit-btn { background: #38bdf8; color: #0f172a; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <div class="ad-banner">
    <span>Advertisement</span>
    Place Ad Banner Code Here (A-Ads or Google AdSense)
  </div>

  <div class="container">
    <header>
      <h1>ShopFinder</h1>
      <p>Find trusted online stores that sell exactly what you are looking for.</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search items (e.g. bikes, hoodie, tech, baby clothes)...">
    </div>

    <div class="filters">
      <select id="locationFilter">
        <option value="all">🌍 All Countries</option>
      </select>

      <select id="sortFilter">
        <option value="rating">Highest Rated</option>
        <option value="fastest">Fastest Shipping</option>
      </select>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <script>
    let storesData = [];

    const searchInput = document.getElementById('searchInput');
    const locationFilter = document.getElementById('locationFilter');
    const sortFilter = document.getElementById('sortFilter');
    const resultsGrid = document.getElementById('resultsGrid');

    async function loadStores() {
      try {
        const response = await fetch('./stores.json');
        storesData = await response.json();
        buildLocationOptions();
        renderStores();
      } catch (err) {
        resultsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">Failed to load store database.</p>`;
      }
    }

    // Automatically build country options based on whatever is inside stores.json
    function buildLocationOptions() {
      const locations = ['all', ...new Set(storesData.map(s => s.location))];
      locationFilter.innerHTML = locations.map(loc => {
        if (loc === 'all') return `<option value="all">🌍 All Countries</option>`;
        return `<option value="${loc}">${loc}</option>`;
      }).join('');
    }

    function renderStores() {
      const rawQuery = searchInput.value.trim();
      const query = rawQuery.toLowerCase();
      const selectedLocation = locationFilter.value;
      const selectedSort = sortFilter.value;

      let filtered = storesData.filter(store => {
        const matchesLocation = selectedLocation === 'all' || store.location === selectedLocation;
        
        // If search bar is blank, show all stores for that country
        if (!query) return matchesLocation;

        // Check category relevance
        const sellsEverything = store.categories && store.categories.includes("all");
        const matchesName = store.name.toLowerCase().includes(query);
        const matchesProduct = store.product.toLowerCase().includes(query);
        const matchesCategory = store.categories && store.categories.some(cat => {
          const c = cat.toLowerCase();
          return c.includes(query) || query.includes(c);
        });

        const matchesSearch = sellsEverything || matchesName || matchesProduct || matchesCategory;

        return matchesLocation && matchesSearch;
      });

      if (selectedSort === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (selectedSort === 'fastest') {
        filtered.sort((a, b) => a.shippingDays - b.shippingDays);
      }

      resultsGrid.innerHTML = '';

      if (filtered.length === 0) {
        resultsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 30px; color: #94a3b8;">No stores found that sell "${rawQuery}". Try searching for something else!</p>`;
        return;
      }

      filtered.forEach(store => {
        const targetUrl = query.length > 0 
          ? `${store.searchUrl}${encodeURIComponent(rawQuery)}` 
          : store.url;

        const buttonLabel = query.length > 0 
          ? `Search "${rawQuery}" on ${store.name} ↗` 
          : `Visit Store ↗`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="store-name">${store.name}</span>
              <span class="rating">★ ${store.rating}</span>
            </div>
            <span class="badge">📍 ${store.location}</span>
            <div class="product-info">
              <div class="item-title">${store.product}</div>
            </div>
          </div>
          <div class="card-footer">
            <span class="shipping">${store.shippingText}</span>
            <a href="${targetUrl}" target="_blank" rel="noopener" class="visit-btn">${buttonLabel}</a>
          </div>
        `;
        resultsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderStores);
    locationFilter.addEventListener('change', renderStores);
    sortFilter.addEventListener('change', renderStores);

    loadStores();
  </script>
</body>
</html>
