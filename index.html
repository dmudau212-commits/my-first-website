<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Search Engine Optimization Tags -->
  <title>EasySearch — Global Store & Product Finder</title>
  <meta name="description" content="EasySearch helps you find trusted online stores worldwide that ship directly to your country with real-time location and currency detection.">
  <meta name="keywords" content="EasySearch, online store finder, global shipping, search products, e-commerce directory">
  <meta name="robots" content="index, follow">

  <!-- Open Graph Meta Tags (for WhatsApp & Social Media Shares) -->
  <meta property="og:title" content="EasySearch — Global Store Finder">
  <meta property="og:description" content="Find trusted online stores worldwide that ship directly to your country.">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
    
    .ad-banner { position: sticky; top: 0; background: #1e293b; border-bottom: 1px solid #334155; text-align: center; padding: 8px; font-size: 12px; color: #38bdf8; z-index: 100; }
    .ad-banner span { color: #94a3b8; font-size: 10px; display: block; text-transform: uppercase; }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin: 20px 0; }
    h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; }

    .location-status { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 14px; margin-bottom: 15px; font-size: 0.85rem; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }

    .search-box { display: flex; gap: 10px; margin: 15px 0; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
    select { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.85rem; outline: none; cursor: pointer; }

    .results-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .results-grid { grid-template-columns: 1fr 1fr; } }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .product-preview-img { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #334155; }
    
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .store-name { font-weight: 600; font-size: 1.1rem; color: #f8fafc; }
    .rating { background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    
    .badges { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
    .badge { display: inline-block; background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; }
    .price-badge { background: #065f46; color: #34d399; font-weight: 600; }
    
    .product-info { margin: 12px 0; border-top: 1px solid #334155; padding-top: 10px; }
    .item-title { font-size: 0.9rem; color: #cbd5e1; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .shipping { font-size: 0.8rem; color: #94a3b8; }
    .visit-btn { background: #38bdf8; color: #0f172a; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <div class="ad-banner">
    <span>Advertisement</span>
    Place Ad Banner Code Here (A-Ads or Google AdSense)
  </div>

  <div class="container">
    <header>
      <h1>EasySearch</h1>
      <p>Search trusted online stores that ship directly to your country.</p>
    </header>

    <div class="location-status" id="locationStatus">
      <span>🌐 Detecting your country...</span>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for items (e.g. iPhone 17, hoodie, bikes)...">
    </div>

    <div class="filters">
      <select id="countryFilter">
        <option value="South Africa">🇿🇦 South Africa (ZAR)</option>
        <option value="United States">🇺🇸 United States (USD)</option>
        <option value="United Kingdom">🇬🇧 United Kingdom (GBP)</option>
        <option value="Nigeria">🇳🇬 Nigeria (NGN)</option>
        <option value="Kenya">🇰🇪 Kenya (KES)</option>
        <option value="Australia">🇦🇺 Australia (AUD)</option>
        <option value="Canada">🇨🇦 Canada (CAD)</option>
        <option value="Germany">🇩🇪 Germany / EU (EUR)</option>
      </select>

      <select id="sortFilter">
        <option value="rating">Highest Rated</option>
        <option value="fastest">Fastest Shipping</option>
      </select>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <script>
    let storesData = [];

    const currencies = {
      "South Africa": { code: "ZAR", symbol: "R", rate: 1, flag: "🇿🇦" },
      "United States": { code: "USD", symbol: "$", rate: 0.056, flag: "🇺🇸" },
      "United Kingdom": { code: "GBP", symbol: "£", rate: 0.042, flag: "🇬🇧" },
      "Nigeria": { code: "NGN", symbol: "₦", rate: 85, flag: "🇳🇬" },
      "Kenya": { code: "KES", symbol: "KSh", rate: 7.2, flag: "🇰🇪" },
      "Australia": { code: "AUD", symbol: "A$", rate: 0.084, flag: "🇦🇺" },
      "Canada": { code: "CAD", symbol: "CA$", rate: 0.076, flag: "🇨🇦" },
      "Germany": { code: "EUR", symbol: "€", rate: 0.050, flag: "🇩🇪" }
    };

    const searchInput = document.getElementById('searchInput');
    const countryFilter = document.getElementById('countryFilter');
    const sortFilter = document.getElementById('sortFilter');
    const resultsGrid = document.getElementById('resultsGrid');
    const locationStatus = document.getElementById('locationStatus');

    async function loadStores() {
      try {
        const response = await fetch('./stores.json');
        storesData = await response.json();
        detectUserCountry();
      } catch (err) {
        resultsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ef4444;">Failed to load store database.</p>`;
      }
    }

    async function detectUserCountry() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        const userCountry = data.country_name;

        if (currencies[userCountry]) {
          countryFilter.value = userCountry;
          locationStatus.innerHTML = `<span>📍 Auto-detected country: <strong>${data.country_name} ${currencies[userCountry].flag}</strong></span>`;
        } else {
          locationStatus.innerHTML = `<span>📍 Location detected: <strong>${data.country_name || 'Global'}</strong> (Showing international stores)</span>`;
        }
      } catch (e) {
        locationStatus.innerHTML = `<span>📍 Selected country: <strong>${countryFilter.value}</strong></span>`;
      }
      renderStores();
    }

    function convertPrice(zarAmount, country) {
      const curr = currencies[country] || currencies["United States"];
      const converted = Math.round(zarAmount * curr.rate);
      return `${curr.symbol}${converted.toLocaleString()}`;
    }

    function renderStores() {
      const rawQuery = searchInput.value.trim();
      const query = rawQuery.toLowerCase();
      const selectedCountry = countryFilter.value;
      const selectedSort = sortFilter.value;

      locationStatus.innerHTML = `<span>📍 Showing stores shipping to: <strong>${selectedCountry} ${currencies[selectedCountry]?.flag || ''}</strong></span>`;

      let filtered = storesData.filter(store => {
        const matchesCountry = store.country === selectedCountry || store.shipsTo.includes("Worldwide") || store.shipsTo.includes(selectedCountry);

        let matchesSearch = true;
        if (query.length > 0) {
          const sellsEverything = store.categories && store.categories.includes("all");
          const matchesName = store.name.toLowerCase().includes(query);
          const matchesProduct = store.product.toLowerCase().includes(query);
          const matchesCategory = store.categories && store.categories.some(cat => {
            const c = cat.toLowerCase();
            return c.includes(query) || query.includes(c);
          });
          matchesSearch = sellsEverything || matchesName || matchesProduct || matchesCategory;
        }

        return matchesCountry && matchesSearch;
      });

      if (selectedSort === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (selectedSort === 'fastest') {
        filtered.sort((a, b) => a.id - b.id);
      }

      resultsGrid.innerHTML = '';

      if (filtered.length === 0) {
        resultsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 30px; color: #94a3b8;">No stores found matching "${rawQuery}" that ship to ${selectedCountry}.</p>`;
        return;
      }

      filtered.forEach(store => {
        const isLocal = store.country === selectedCountry;
        const shippingTime = isLocal ? `⚡ ${store.localShippingDays}` : `✈️ ${store.intlShippingDays}`;
        const minP = convertPrice(store.minPriceZAR, selectedCountry);
        const maxP = convertPrice(store.maxPriceZAR, selectedCountry);

        let sampleProductImg = null;
        if (query.length > 0 && store.sampleProducts) {
          const match = store.sampleProducts.find(p => p.keywords.some(k => query.includes(k) || k.includes(query)));
          if (match) sampleProductImg = match.image;
        }

        const targetUrl = query.length > 0 
          ? `${store.searchUrl}${encodeURIComponent(rawQuery)}` 
          : store.url;

        const buttonLabel = query.length > 0 
          ? `Search "${rawQuery}" on ${store.name} ↗` 
          : `Visit Store ↗`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${sampleProductImg ? `<img src="${sampleProductImg}" alt="${rawQuery}" class="product-preview-img">` : ''}
          <div class="card-body">
            <div>
              <div class="card-header">
                <span class="store-name">${store.name}</span>
                <span class="rating">★ ${store.rating}</span>
              </div>
              <div class="badges">
                <span class="badge">${store.flag} ${store.country} ${isLocal ? '(Local)' : '(Global)'}</span>
                <span class="badge price-badge">🏷️ ${minP} - ${maxP}</span>
              </div>
              <div class="product-info">
                <div class="item-title">${store.product}</div>
              </div>
            </div>
            <div class="card-footer">
              <span class="shipping">${shippingTime}</span>
              <a href="${targetUrl}" target="_blank" rel="noopener" class="visit-btn">${buttonLabel}</a>
            </div>
          </div>
        `;
        resultsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderStores);
    countryFilter.addEventListener('change', renderStores);
    sortFilter.addEventListener('change', renderStores);

    loadStores();
  </script>
</body>
</html>
